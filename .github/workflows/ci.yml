name: SE Brain CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Compile package
        run: python -m compileall -q sebrain

      - name: Run tests
        run: python -m pytest -q

  knowledge-fabric:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Validate real intended Knowledge Fabric
        run: python scripts/validate_knowledge_fabric.py

      - name: Validate training-data preparation
        run: python scripts/prepare_training_data.py --output /tmp/sebrain-training.jsonl

  brain-smoke:
    runs-on: ubuntu-latest
    needs: knowledge-fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run no-LLM Brain smoke
        run: python scripts/brain_smoke.py
